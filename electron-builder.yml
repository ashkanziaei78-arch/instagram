appId: com.ashkan.igautosuite
productName: IG Auto Suite
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  - '!**/{.vscode,.git,docs,src}'
asarUnpack:
  - '**/*.node'
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: IG Auto Suite
