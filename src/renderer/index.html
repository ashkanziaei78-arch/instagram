<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP سخت‌گیرانه: هیچ اسکریپت یا اتصال شبکه‌ای از renderer مجاز نیست.
      همه‌ی تماس‌های شبکه از فرایند main انجام می‌شود، پس renderer نیازی ندارد.
      این یعنی حتی اگر جایی HTML ناامن تزریق شود، نمی‌تواند به بیرون داده بفرستد.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self'"
    />
    <title>Directino</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
