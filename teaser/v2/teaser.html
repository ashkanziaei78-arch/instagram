<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8">
<title>English Journey Teaser</title>
<style>
@font-face{font-family:Vazirmatn;font-weight:500;src:url(../fonts/vazirmatn-arabic-500-normal.woff2)}
@font-face{font-family:Vazirmatn;font-weight:700;src:url(../fonts/vazirmatn-arabic-700-normal.woff2)}
@font-face{font-family:Vazirmatn;font-weight:800;src:url(../fonts/vazirmatn-arabic-800-normal.woff2)}
@font-face{font-family:VazirLatin;font-weight:700;src:url(../fonts/vazirmatn-latin-700-normal.woff2)}
@font-face{font-family:Lalezar;src:url(../fonts/lalezar-arabic-400-normal.woff2)}
@font-face{font-family:Bebas;src:url(../fonts/bebas-neue-latin-400-normal.woff2)}
@font-face{font-family:Mono;font-weight:500;src:url(../fonts/jetbrains-mono-latin-500-normal.woff2)}
@font-face{font-family:Mono;font-weight:800;src:url(../fonts/jetbrains-mono-latin-800-normal.woff2)}

:root{
  --navy:#14213D; --paper:#FFF8EC; --cream:#FBF3E6; --coral:#E8634A; --stamp:#D23C2A;
  --slate:#3B4046; --tile-mute:#2B2F34; --mute:#AEB3B8;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--cream)}
.abs{position:absolute}
.fa{font-family:Vazirmatn,VazirLatin,sans-serif;direction:rtl;text-align:center}
.mono{font-family:Mono,monospace;letter-spacing:.12em}
.bebas{font-family:Bebas,sans-serif}
.scene{position:absolute;inset:0;opacity:0}
.r{display:block;will-change:transform,opacity}

/* split-flap */
.board{display:flex;justify-content:center;gap:8px;direction:ltr}
.tile{position:relative;display:flex;align-items:center;justify-content:center;font-family:Mono;font-weight:800;border-radius:10px;overflow:hidden}
.tile::after{content:"";position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;background:rgba(0,0,0,.35)}
.tile.sp::after{display:none}

/* title */
#title .flight{top:480px;left:0;right:0;text-align:center;font-size:28px;color:var(--navy)}
#title .rows{top:570px;left:0;right:0;display:flex;flex-direction:column;gap:14px}
#title .tile{width:86px;height:122px;font-size:78px;background:var(--navy);color:var(--cream)}
#title .row-4 .tile{background:var(--coral)}
#title .sub{top:1235px;left:0;right:0;font-size:58px;font-weight:800;color:var(--navy)}

/* need */
.need .code{top:460px;left:0;right:0;text-align:center;font-size:30px;color:#7B8188}
.need .board{position:absolute;top:530px;left:0;right:0}
.need .tile{width:104px;height:146px;font-size:92px;background:var(--tile-mute);color:#8D9298}
.need .q{top:790px;left:60px;right:60px;font-size:74px;font-weight:700;line-height:1.6;color:var(--mute)}

/* course */
.course .big{top:40px;left:-40px;right:-40px;text-align:center;font-size:560px;line-height:1;opacity:.16;color:var(--navy)}
.pass{position:absolute;left:80px;width:920px;top:330px;height:1120px;background:var(--paper);border-radius:34px;box-shadow:0 40px 80px rgba(20,33,61,.25);overflow:hidden}
.pass .head{height:118px;background:var(--navy);display:flex;align-items:center;justify-content:space-between;padding:0 52px;color:var(--paper);font-size:32px;direction:ltr}
.pass .route{display:flex;justify-content:space-between;align-items:flex-end;padding:44px 64px 0;direction:ltr;color:var(--navy)}
.pass .route small{display:block;font-family:Mono;font-size:24px;letter-spacing:.2em;color:#8A8F9C;margin-bottom:4px}
.pass .route .c{font-family:Bebas;font-size:150px;line-height:.9}
.pass .route svg{margin-bottom:40px}
.pass .eyebrow{font-family:Bebas;font-size:60px;letter-spacing:.08em;text-align:center;margin-top:40px}
.pass .name{font-family:Lalezar,Vazirmatn;font-size:124px;color:var(--navy);line-height:1.25;margin-top:6px}
.pass .desc{font-size:50px;font-weight:700;color:#3A4560;line-height:1.6;margin-top:18px}
.pass .perf{position:absolute;left:0;right:0;top:880px;border-top:5px dashed #D9CDB8}
.pass .notch{position:absolute;top:856px;width:52px;height:52px;border-radius:50%}
.pass .stub{position:absolute;left:0;right:0;top:910px;bottom:0;display:flex;align-items:center;justify-content:flex-start;gap:44px;padding:0 64px;direction:ltr}
.pass .stub .info{font-family:Mono;font-size:24px;color:var(--navy);line-height:1.7;text-align:left}
.pass .stub .info b{font-weight:800}
.stamp{position:absolute;width:250px;height:250px}

/* end */
#end .board{position:absolute;top:250px;left:0;right:0;gap:6px}
#end .tile{width:56px;height:80px;font-size:50px;background:var(--navy);color:var(--cream);border-radius:7px}
#end .tile.sp{background:transparent}
#end .me{top:430px;left:0;right:0;font-family:Lalezar,Vazirmatn;font-size:170px;color:var(--navy);line-height:1.2}
#end .exp{top:670px;left:0;right:0;font-size:52px;font-weight:700;color:var(--navy)}
#end .exp span{color:var(--coral)}
#end .tags{top:800px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:24px}
#end .tag{position:relative;font-size:44px;font-weight:700;color:var(--navy);background:var(--paper);border:3px solid var(--navy);border-radius:16px 60px 60px 16px;padding:14px 60px 14px 90px}
#end .tag::before{content:"";position:absolute;left:28px;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;border:3px solid var(--navy)}
#end .ask{top:1080px;left:0;right:0;font-size:52px;font-weight:700;color:var(--navy)}
#end .cta{top:1175px;left:250px;width:580px;height:150px;background:var(--coral);color:var(--paper);font-size:68px;font-weight:800;display:flex;align-items:center;justify-content:center;border-radius:22px;
  -webkit-mask:radial-gradient(circle at 0 50%,transparent 28px,#000 29px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent 28px,#000 29px) right/51% 100% no-repeat}
#end .handle{top:1375px;left:0;right:0;text-align:center;font-size:52px;font-weight:800;color:var(--navy);letter-spacing:.04em}
#path{position:absolute;inset:0}
#grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:multiply;pointer-events:none}
</style>
</head>
<body>
<div id="stage">
  <div class="abs" id="wipe" style="inset:0"></div>

  <section class="scene" id="title">
    <div class="abs flight mono r">FLIGHT EN-101 · ONLINE · FROM ANYWHERE</div>
    <div class="abs rows">
      <div class="board row-1"></div><div class="board row-2"></div><div class="board row-3"></div><div class="board row-4"></div>
    </div>
    <div class="abs fa sub r">دوره‌های آنلاین زبان انگلیسی</div>
  </section>

  <div id="scenes"></div>

  <section class="scene" id="end">
    <div class="board"></div>
    <div class="abs fa me r">من سارام</div>
    <div class="abs fa exp r"><span>۸ سال</span> تجربه‌ی تدریس انگلیسی و آیلتس</div>
    <div class="abs fa tags"><div class="tag r">کلاس خصوصی و گروهی</div><div class="tag r">آنلاین از هر جای دنیا</div></div>
    <div class="abs fa ask r">نمی‌دونی کدوم دوره مناسبته؟</div>
    <div class="abs fa cta r">پیام بده&nbsp;<span style="font-family:serif">♥</span></div>
    <div class="abs mono handle r">@sarasbr_eng</div>
  </section>

  <svg id="path" width="1080" height="1920"><path id="fp" fill="none" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 16"/><g id="plane"><path d="M-26 0 L22 -4 Q34 0 22 4 L-26 0Z M-4 -2 L-16 -26 L-8 -26 L10 -2Z M-4 2 L-16 26 L-8 26 L10 2Z M-24 -1 L-30 -12 L-24 -12 L-16 -1Z M-24 1 L-30 12 L-24 12 L-16 1Z"/></g></svg>
  <svg id="grain" width="1080" height="1920"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="5"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</div>

<script>
// ---------- timeline (must match v2/music.py) ----------
const BEAT = .5, DUR = 46, STAMP = 1.5;
const COURSES = [
  { code: 'FDS', color: '#F29E5C', ink: '#B4561B', eyebrow: 'FREE DISCUSSION', name: 'فری دیسکاشن', icon: 'bubble',
    need: 'کلی لغت بلدی،<br>ولی وقت حرف زدن<br>قفل می‌کنی؟',
    desc: 'راحت و بدون استرس صحبت کن' },
  { code: 'GEN', color: '#6FAEDB', ink: '#2A6EA0', eyebrow: 'GENERAL ENGLISH · A2 → ADVANCED', name: 'جنرال انگلیش', icon: 'book',
    need: 'گرامر و لغت بلدی،<br>ولی کنار هم<br>نمی‌چسبن؟',
    desc: '<span style="direction:ltr;unicode-bidi:isolate">A2</span> تا پیشرفته<br>گرامر، لغت و مکالمه، همه‌چیز باهم' },
  { code: 'PRE', color: '#7BC4A4', ink: '#2F7F5D', eyebrow: 'PRE-IELTS', name: 'پیش‌آیلتس', icon: 'target',
    need: 'فاصله‌ی سطح فعلی‌ت<br>تا آیلتس زیاده؟',
    desc: 'فاصله رو پر کن و آماده شو' },
  { code: 'IEL', color: '#E8634A', ink: '#A8321E', eyebrow: 'IELTS ACADEMIC', name: 'آیلتس آکادمیک', icon: 'trophy',
    need: 'باند ۶.۵ یا ۷ لازم داری<br>و نمی‌خوای آزمون رو<br>دوباره بدی؟',
    desc: 'رسیدن به باند ۶.۵ تا ۷+<br>با استراتژی واقعی و شبیه‌سازی آزمون' },
];
const ICONS = {
  bubble: '<path d="M40 60h130a22 22 0 0 1 22 22v62a22 22 0 0 1-22 22h-70l-38 32v-32H40a22 22 0 0 1-22-22V82a22 22 0 0 1 22-22z"/><path d="M62 104h86M62 128h56"/>',
  book: '<path d="M115 62c-26-16-60-18-92-10v126c32-8 66-6 92 10 26-16 60-18 92-10V52c-32-8-66-6-92 10z"/><path d="M115 62v126"/>',
  target: '<circle cx="115" cy="118" r="82"/><circle cx="115" cy="118" r="52"/><circle cx="115" cy="118" r="20"/><path d="M115 118L190 40M170 40h20v20"/>',
  trophy: '<path d="M70 40h90v58a45 45 0 0 1-90 0z"/><path d="M70 58H36a30 30 0 0 0 34 42M160 58h34a30 30 0 0 1-34 42"/><path d="M115 143v35M80 196h70M92 178h46"/>',
};
const PLANE_SMALL = '<svg width="120" height="60" viewBox="-60 -30 120 60"><path d="M-50 0h86" stroke="#14213D" stroke-width="4" stroke-dasharray="2 12" stroke-linecap="round"/><g transform="translate(40 0)" fill="#14213D"><path d="M-26 0 L22 -4 Q34 0 22 4 L-26 0Z M-4 -2 L-16 -26 L-8 -26 L10 -2Z M-4 2 L-16 26 L-8 26 L10 2Z"/></g></svg>';

const SCENES = [{ id: 'title', a: 0, b: 6, kind: 'title', bg: '#FBF3E6' }];
let t0 = 6;
COURSES.forEach((c, i) => {
  SCENES.push({ id: 'need' + i, a: t0, b: t0 + 3, kind: 'need', i, bg: '#3B4046' });
  SCENES.push({ id: 'course' + i, a: t0 + 3, b: t0 + 8, kind: 'course', i, bg: c.color });
  t0 += 8;
});
SCENES.push({ id: 'end', a: 38, b: 46, kind: 'end', bg: '#FBF3E6' });

// deterministic barcode
function barcode(seed) {
  let x = seed * 9301 + 49297, s = '', px = 0;
  for (let i = 0; i < 38; i++) { x = (x * 9301 + 49297) % 233280; const w = 2 + (x % 5); s += `<rect x="${px}" y="0" width="${w}" height="120" fill="#14213D"/>`; px += w + 3 + (x % 4); }
  return `<svg width="${px}" height="120">${s}</svg>`;
}

const host = document.getElementById('scenes');
COURSES.forEach((c, i) => {
  host.insertAdjacentHTML('beforeend', `
  <section class="scene need" id="need${i}">
    <div class="abs code mono r">EN-10${i + 1} · STATUS</div>
    <div class="board" data-text="DELAYED"></div>
    <div class="abs fa q">${c.need.split('<br>').map(l => `<span class="r">${l}</span>`).join('')}</div>
  </section>
  <section class="scene course" id="course${i}">
    <div class="abs big bebas" style="color:${c.ink}">${c.code}</div>
    <div class="pass">
      <div class="head mono"><span>BOARDING PASS</span><span>EN-10${i + 1}</span></div>
      <div class="route r"><div><small>FROM</small><span class="c">YOU</span></div>${PLANE_SMALL}<div style="text-align:right"><small>TO</small><span class="c" style="color:${c.ink}">${c.code}</span></div></div>
      <div class="eyebrow r" style="color:${c.ink}">${c.eyebrow}</div>
      <div class="fa name r">${c.name}</div>
      <div class="fa desc">${c.desc.split('<br>').map(l => `<span class="r">${l}</span>`).join('')}</div>
      <div class="perf"></div>
      <div class="notch" style="left:-26px;background:${c.color}"></div><div class="notch" style="right:-26px;background:${c.color}"></div>
      <div class="stub r">${barcode(i + 3)}<div class="info">GATE <b>ONLINE</b><br>SEAT <b>ANYWHERE</b><br>CLASS <b>1:1 / GROUP</b></div></div>
    </div>
    <svg class="stamp" viewBox="0 0 250 250" style="left:770px;top:1222px">
      <g fill="none" stroke="#D23C2A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="125" cy="125" r="116"/><circle cx="125" cy="125" r="100" stroke-width="3"/>
        <g transform="translate(58 42) scale(.58)" stroke-width="12">${ICONS[c.icon]}</g>
      </g>
      <text x="125" y="200" text-anchor="middle" font-family="Mono" font-weight="800" font-size="26" fill="#D23C2A" letter-spacing="3">APPROVED</text>
    </svg>
  </section>`);
});

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const easeInOut = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const backOut = (x, c = 1.6) => { x = clamp(x); return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const pulse = t => Math.exp(-((t % BEAT) / .08));
function rise(el, p, dy = 50) {
  const e = easeOut(p);
  el.style.opacity = e;
  el.style.transform = `translateY(${(1 - backOut(p)) * dy}px)`;
}

// ---------- split-flap ----------
const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789·';
function buildBoard(el, text) {
  el.innerHTML = [...text].map(ch => `<div class="tile${ch === ' ' ? ' sp' : ''}" data-ch="${ch}"></div>`).join('');
}
function flap(el, t, start, step = .07, spin = .45) {
  el.querySelectorAll('.tile').forEach((tile, i) => {
    const ch = tile.dataset.ch, t1 = start + i * step, t2 = t1 + spin;
    if (ch === ' ') { tile.textContent = ''; return; }
    if (t < t1) { tile.textContent = ''; tile.style.transform = 'scaleY(1)'; tile.style.opacity = t < t1 - .15 ? 0 : 1; return; }
    tile.style.opacity = 1;
    if (t < t2) {
      const k = Math.floor(t * 30);
      tile.textContent = CHARS[(k * 7 + i * 13) % CHARS.length];
      tile.style.transform = `scaleY(${.82 + .18 * ((t * 30) % 1)})`;
    } else { tile.textContent = ch; tile.style.transform = 'scaleY(1)'; }
  });
}
document.querySelectorAll('#title .board').forEach((b, i) => buildBoard(b, ['SPEAK', 'ENGLISH', 'WITH', 'CONFIDENCE'][i]));
document.querySelectorAll('.need .board').forEach(b => buildBoard(b, b.dataset.text));
buildBoard(document.querySelector('#end .board'), 'SEE YOU ON BOARD');

// ---------- background: wipes between scene colours ----------
const stage = document.getElementById('stage'), wipe = document.getElementById('wipe');
function drawBackground(t) {
  let cur = SCENES[0], prev = SCENES[0];
  SCENES.forEach((s, k) => { if (t >= s.a) { cur = s; prev = SCENES[Math.max(0, k - 1)]; } });
  const lt = t - cur.a;
  stage.style.background = prev.bg;
  wipe.style.background = cur.bg;
  if (cur.kind === 'need') {           // lights dim quickly
    wipe.style.clipPath = 'none'; wipe.style.opacity = easeInOut(lt / .3);
  } else {                             // colour sweeps up from the bottom with a slanted edge
    const p = easeInOut(lt / .45) * 130;
    wipe.style.opacity = 1;
    wipe.style.clipPath = cur.id === 'title' ? 'none' : `polygon(0 ${100 - p + 12}%, 100% ${100 - p}%, 100% 100%, 0 100%)`;
  }
}

// flight path with plane (title & end)
const fp = document.getElementById('fp'), plane = document.getElementById('plane');
function drawPath(t) {
  let d, p, vis, col = '#14213D';
  if (t < 6.2) { d = 'M-60 1470 C 260 1330, 520 1630, 820 1410 S 1100 1330, 1160 1310'; p = easeInOut((t - 2.4) / 3.2); vis = clamp((t - 2.2) / .3) * clamp((6.1 - t) / .3); }
  else if (t > 37.8) { d = 'M-60 1580 C 240 1480, 560 1680, 820 1540 S 1080 1480, 1160 1470'; p = easeInOut((t - 41.5) / 3.8); vis = clamp((t - 41.2) / .3) * clamp((46 - t) / .8); }
  else { fp.style.opacity = 0; plane.style.opacity = 0; return; }
  fp.setAttribute('d', d); fp.setAttribute('stroke', col); plane.setAttribute('fill', col);
  const L = fp.getTotalLength(), at = L * p;
  fp.style.opacity = vis * .55; plane.style.opacity = vis;
  fp.style.strokeDashoffset = 0;
  fp.setAttribute('stroke-dasharray', `2 16`);
  fp.style.clipPath = `inset(0 ${100 - clamp(fp.getPointAtLength(at).x / 10.8, 0, 100)}% 0 0)`;
  const pt = fp.getPointAtLength(at), pt2 = fp.getPointAtLength(Math.min(L, at + 2));
  const ang = Math.atan2(pt2.y - pt.y, pt2.x - pt.x) * 180 / Math.PI;
  plane.setAttribute('transform', `translate(${pt.x} ${pt.y}) rotate(${ang}) scale(1.3)`);
}

// ---------- scenes ----------
function alpha(t, s, fin, fout) { return clamp((t - s.a) / fin) * clamp((s.b - t) / fout); }

function drawTitle(t, s, el) {
  el.style.opacity = alpha(t, s, .01, .3);
  rise(el.querySelector('.flight'), (t - .1) / .5, 20);
  el.querySelectorAll('.board').forEach((b, i) => flap(b, t, .2 + i * .42, .05, .4));
  rise(el.querySelector('.sub'), (t - 2.5) / .6, 40);
  const k = t > 2 ? pulse(t) : 0;
  el.querySelector('.rows').style.transform = `scale(${1 + k * .012})`;
}

function drawNeed(t, s, el) {
  const lt = t - s.a;
  el.style.opacity = alpha(t, s, .25, .15);
  rise(el.querySelector('.code'), lt / .4, 10);
  flap(el.querySelector('.board'), t, s.a + .05, .06, .45);
  el.querySelectorAll('.q .r').forEach((r, i) => rise(r, (lt - .9 - i * BEAT * .8) / .6, 30));
  el.querySelector('.q').style.transform = `translateX(${Math.sin(lt * 2.6) * 4}px)`;
}

function drawCourse(t, s, el) {
  const lt = t - s.a;
  el.style.opacity = clamp((t - s.a + .05) / .05) * clamp((s.b - t) / .25);
  const big = el.querySelector('.big');
  big.style.transform = `translateY(${(1 - easeOut(lt / .8)) * 120 - lt * 10}px) scale(${1 + pulse(t) * .02})`;
  big.style.opacity = .16 * easeOut(lt / .6);

  const pass = el.querySelector('.pass');
  const pp = (lt + .05) / .65;
  // stamp impact shake
  const sh = lt > STAMP ? Math.exp(-(lt - STAMP) / .06) : 0;
  pass.style.transform = `translateY(${(1 - backOut(pp, 1.2)) * 1400 + sh * 14}px) rotate(${lerp(-9, -1.5, easeOut(pp)) + sh * .6}deg)`;
  const rs = pass.querySelectorAll('.r');
  rise(rs[0], (lt - .45) / .5, 30);            // route
  rise(rs[1], (lt - .7) / .5, 30);             // eyebrow
  rise(rs[2], (lt - .95) / .55, 60);           // persian name
  let j = 3;
  for (; j < rs.length - 1; j++) rise(rs[j], (lt - 1.25 - (j - 3) * .35) / .5, 30);
  rise(rs[j], (lt - 1.2) / .5, 20);            // stub
  rs[2].style.transform += ` scale(${1 + pulse(t) * .015})`;

  const st = el.querySelector('.stamp');
  const sp = (lt - STAMP + .16) / .16;
  st.style.opacity = sp <= 0 ? 0 : .92 * clamp(sp * 1.5);
  st.style.transform = `rotate(-14deg) scale(${sp >= 1 ? 1 : lerp(2.6, 1, easeInOut(sp))})`;
}

function drawEnd(t, s, el) {
  const lt = t - s.a;
  el.style.opacity = clamp(lt / .15) * clamp((46 - t) / .8);
  flap(el.querySelector('.board'), t, 38.1, .045, .4);
  const rs = el.querySelectorAll('.r');
  const at = [.5, 1.0, 1.5, 2.0, 2.5, 3.0, 3.5];
  rs.forEach((r, i) => rise(r, (lt - at[i]) / .55, i === 0 ? 80 : 40));
  const cta = el.querySelector('.cta');
  if (lt > 3.2 && t < 44) cta.style.transform += ` scale(${1 + pulse(t) * .05})`;
}

function render(t) {
  drawBackground(t);
  drawPath(t);
  for (const s of SCENES) {
    const el = document.getElementById(s.id);
    if (t < s.a - .01 || t > s.b + .01) { el.style.opacity = 0; continue; }
    ({ title: drawTitle, need: drawNeed, course: drawCourse, end: drawEnd })[s.kind](t, s, el);
  }
}
window.render = render;
window.DUR = DUR;
if (!location.search.includes('capture')) {
  const start = performance.now();
  (function loop() { render(((performance.now() - start) / 1000) % DUR); requestAnimationFrame(loop); })();
} else render(0);
</script>
</body>
